name: Temporary 0.5.2 Character Match

on:
  push:
    branches: [fix/frontier-camera-reach-visuals-0.5.2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frontier-camera-reach-visuals-0.5.2
          fetch-depth: 0
      - name: Apply reference character pass
        run: python3 tools/apply_0_5_2_character_match.py
      - name: Commit character sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/character/PlayerBodyRig.cpp src/render/scene/VoxelCharacterBuilder.cpp tests/TestCharacterRig.cpp
          git commit -m "feat: sculpt reference-driven voxel hero [character-match]"
          git push origin HEAD:fix/frontier-camera-reach-visuals-0.5.2
