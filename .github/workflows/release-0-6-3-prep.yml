name: Prepare 0.6.3 Release Commit

on:
  push:
    branches:
      - release/0.6.3-prep

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged source head
        uses: actions/checkout@v4
        with:
          ref: 48f9565401ac37cbc62eb5cb33c1ffc11c9fb5fc
          fetch-depth: 0
      - name: Create atomic release version commit
        shell: bash
        run: |
          set -euo pipefail
          printf '0.6.3\n' > VERSION
          python - <<'PY'
          from pathlib import Path
          path = Path('CMakeLists.txt')
          text = path.read_text()
          old = 'project(RuneForgeRealms VERSION 0.6.2 LANGUAGES C CXX)'
          new = 'project(RuneForgeRealms VERSION 0.6.3 LANGUAGES C CXX)'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one 0.6.2 project version line')
          path.write_text(text.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION CMakeLists.txt
          git commit -m "release: RuneForge Realms 0.6.3 reference turf correction"
          git push origin HEAD:refs/heads/release/0.6.3-ready --force
