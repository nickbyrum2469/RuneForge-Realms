name: Temporary 0.5.2 Autopatch Runner

on:
  push:
    branches: [fix/frontier-camera-reach-visuals-0.5.2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frontier-camera-reach-visuals-0.5.2
          fetch-depth: 0
      - name: Apply deterministic source patch
        run: python3 tools/apply_0_5_2_patch.py
      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src shaders tests
          git commit -m "fix: repair camera reach targeting and voxel visuals [autopatch]"
          git push origin HEAD:fix/frontier-camera-reach-visuals-0.5.2
