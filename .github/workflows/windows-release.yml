name: Windows Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runeforge-windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION must be semantic x.y.z" }
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch "project\(RuneForgeRealms VERSION $([regex]::Escape($version)) LANGUAGES") {
            throw "VERSION ($version) and CMake project version must match"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Guard published version identity
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          git fetch --tags --force
          $matchingTag = @(git tag --list $env:TAG)
          if ($matchingTag.Count -gt 0) {
            $existing = (git rev-list -n 1 $env:TAG).Trim()
            if ($existing -ne $env:GITHUB_SHA) {
              throw "Version $env:VERSION is already published at $existing. Refusing to replace its assets with different code $env:GITHUB_SHA. Bump VERSION and the CMake project version before release."
            }
          }

      - name: Install shader compiler
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup_windows_deps.ps1

      - name: Configure
        run: cmake -S . -B build -A x64 -DRF_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage install
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          cmake --install build --config Release --prefix "$PWD/staging/RuneForgeRealms"
          Copy-Item README.md staging/RuneForgeRealms/README.md

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path staging/RuneForgeRealms -DestinationPath RuneForgeRealms-Windows-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash RuneForgeRealms-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  RuneForgeRealms-Windows-x64.zip" | Set-Content RuneForgeRealms-Windows-x64.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $notes = "RuneForge Realms $env:VERSION for Windows x64. This package contains the current Frontier Realms runtime, native bootstrapper, shaders, and bundled README. Extract the ZIP and run RuneForgeBootstrap.exe; later published runtime versions are detected by the bootstrapper on startup."
          $releases = gh release list --limit 100 --json tagName | ConvertFrom-Json
          $existingRelease = $releases | Where-Object { $_.tagName -eq $env:TAG } | Select-Object -First 1
          if ($existingRelease) {
            Write-Host "Release $env:TAG already exists at this exact commit; refreshing reproducible assets."
          } else {
            gh release create $env:TAG --target $env:GITHUB_SHA --title "RuneForge Realms $env:VERSION" --notes $notes --latest
          }
          gh release upload $env:TAG RuneForgeRealms-Windows-x64.zip RuneForgeRealms-Windows-x64.sha256 --clobber
