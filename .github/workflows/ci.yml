name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DRF_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shader compiler
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./tools/setup_windows_deps.ps1
      - name: Configure
        run: cmake -S . -B build -A x64 -DRF_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage hardware-validation build
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          cmake --install build --config Release --prefix "$PWD/staging/RuneForgeRealms"
          Copy-Item README.md staging/RuneForgeRealms/README.md
      - name: Upload hardware-validation build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: RuneForgeRealms-Windows-x64-PR-${{ github.event.pull_request.number }}
          path: staging/RuneForgeRealms
          if-no-files-found: error
          retention-days: 7
