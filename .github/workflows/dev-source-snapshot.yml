name: Apply Reference Turf Correction

on:
  push:
    branches:
      - fix/reference-turf-mass-0.6.3

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/reference-turf-mass-0.6.3
          fetch-depth: 0
      - name: Apply staged reference correction
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/reference-turf.patch
          git apply .github/reference-turf.patch
          rm .github/reference-turf.patch
          rm .github/workflows/dev-source-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(surface): match chunky turf and embedded soil reference"
          git push origin HEAD:fix/reference-turf-mass-0.6.3
