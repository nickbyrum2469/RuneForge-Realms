name: Temporary Frontier 0.5.3 Polish Patch

on:
  push:
    branches: [fix/frontier-polish-integration-0.5.3]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frontier-polish-integration-0.5.3
          fetch-depth: 0
      - name: Apply UI material and crosshair patch
        run: python3 tools/apply_frontier_0_5_3_polish.py
      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/windows/NativeWindow.cpp src/render/scene/FirstPersonBodyBuilder.cpp shaders/voxel_scene.hlsl
          git commit -m "fix: repair modal composition and rebuild Frontier materials [polish-patch]"
          git push origin HEAD:fix/frontier-polish-integration-0.5.3
